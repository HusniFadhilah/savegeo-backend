services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: savegeo
      POSTGRES_USER: savegeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savegeo -d savegeo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - savegeo_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SAVEGEO_PRODUCT_VERSION: ${SAVEGEO_PRODUCT_VERSION:-}
        SAVEGEO_COMMIT_SHA: ${SAVEGEO_COMMIT_SHA:-}
        SAVEGEO_BUILD_NUMBER: ${SAVEGEO_BUILD_NUMBER:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://savegeo:${POSTGRES_PASSWORD}@db:5432/savegeo
      UPLOAD_DIR: /app/var/uploads
      MODEL_DIR: /app/var/saved_models
      CARBON_TILE_CACHE_DIR: /app/var/carbon_tile_cache
      CAMS_ARCHIVE_DIR: /app/var/cams/archive
      IBM_GRANITE_BIOMASS_ENABLED: ${IBM_GRANITE_BIOMASS_ENABLED:-true}
      # Ollama normally runs on the LEN host (the H100 server). The host-gateway
      # alias lets the API container reach it without exposing Ollama publicly.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      SAVEGEO_RUN_ATTEMPT: ${SAVEGEO_RUN_ATTEMPT:-}
      SAVEGEO_REF: ${SAVEGEO_REF:-}
      SAVEGEO_BUILD_TIME_UTC: ${SAVEGEO_BUILD_TIME_UTC:-}
      SAVEGEO_WORKFLOW_NAME: ${SAVEGEO_WORKFLOW_NAME:-}
      SAVEGEO_WORKFLOW_RUN_ID: ${SAVEGEO_WORKFLOW_RUN_ID:-}
      SAVEGEO_WORKFLOW_RUN_URL: ${SAVEGEO_WORKFLOW_RUN_URL:-}
      SAVEGEO_DEPLOYMENT_ENVIRONMENT: ${SAVEGEO_DEPLOYMENT_ENVIRONMENT:-}
      SAVEGEO_DEPLOYMENT_METADATA_FILE: /app/var/deployment-metadata.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python -m alembic upgrade head &&
        python -m scripts.seed_rbac &&
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8086
        --workers $${WEB_CONCURRENCY:-2}
    ports:
      # The LEN public reverse proxy reaches the backend on the server LAN IP.
      - "8086:8086"
    volumes:
      # Runtime data and deployment metadata persist outside source sync.
      - ./var:/app/var

volumes:
  savegeo_pgdata:
