services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: savegeo
      POSTGRES_USER: savegeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savegeo -d savegeo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - savegeo_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://savegeo:${POSTGRES_PASSWORD}@db:5432/savegeo
      UPLOAD_DIR: /app/var/uploads
      MODEL_DIR: /app/var/saved_models
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8086
        --workers $${WEB_CONCURRENCY:-2}
    ports:
      # The LEN public reverse proxy reaches the backend on the server LAN IP.
      - "8086:8086"
    volumes:
      - ./var/uploads:/app/var/uploads
      - ./var/saved_models:/app/var/saved_models
      - ./var/gee-credentials:/app/var/gee-credentials

volumes:
  savegeo_pgdata:
