[extend]
useDefault = true

[[allowlists]]
description = "Allow local-only and templated credential placeholders"
condition = "OR"
regexes = [
  '''postgresql\+psycopg://postgres:postgres@localhost:5432/postgres''',
  '''postgresql\+psycopg://savegeo:\$\{POSTGRES_PASSWORD\}@db:5432/savegeo''',
  '''JWT_SECRET_KEY=change_''',
  '''sentinel5p_ch4''',
  '''copernicus_s2_l2a''',
  '''copernicus_s2_l1c''',
]
