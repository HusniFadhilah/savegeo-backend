services:
  backup-s3:
    image: chrislusf/seaweedfs:4.53
    user: "1000:1000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3-config.json
      - -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ../private-backups/local-s3/data:/data
      - ../private-backups/local-s3/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    stop_grace_period: 30s
