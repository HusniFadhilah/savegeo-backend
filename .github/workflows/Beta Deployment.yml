name: Deploy FastAPI

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # LOGIN GHCR
      # ==========================================

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ==========================================
      # BUILD FASTAPI IMAGE
      # ==========================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ==========================================
      # VPN
      # ==========================================

      - name: Install VPN and SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openvpn \
            sshpass \
            netcat-openbsd

      - name: Prepare VPN config
        env:
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
        run: |
          set -euo pipefail

          echo "$VPN_CONFIG_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/client.ovpn"

          echo "$VPN_AUTH_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/vpn-auth.txt"

          chmod 600 "$RUNNER_TEMP/client.ovpn"
          chmod 600 "$RUNNER_TEMP/vpn-auth.txt"

      - name: Connect VPN
        run: |
          sudo openvpn \
            --config "$RUNNER_TEMP/client.ovpn" \
            --auth-user-pass "$RUNNER_TEMP/vpn-auth.txt" \
            --daemon \
            --log "$RUNNER_TEMP/openvpn.log"

      # ==========================================
      # WAIT SERVER
      # ==========================================

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do

            if nc -z -w 3 192.168.17.55 6970; then
              echo "Server reachable"
              exit 0
            fi

            echo "Waiting VPN..."
            sleep 3

          done

          echo "Server unreachable"

          sudo cat "$RUNNER_TEMP/openvpn.log" || true

          exit 1

      # ==========================================
      # SSH
      # ==========================================

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # ==========================================
      # LOGIN GHCR FROM PRODUCTION
      # ==========================================

      - name: Login production server to GHCR
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          printf '%s' "${{ github.token }}" \
          | sshpass -e ssh \
              -p 6970 \
              ubuntu@192.168.17.55 \
              "docker login ghcr.io \
                -u '${{ github.actor }}' \
                --password-stdin"

      # ==========================================
      # DEPLOY
      # ==========================================

      - name: Deploy FastAPI
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p 6970 \
            ubuntu@192.168.17.55 \
            '
              set -e

              cd /opt/fastapi

              docker compose pull

              docker compose up -d

              docker compose ps
            '

      # ==========================================
      # HEALTH CHECK
      # ==========================================

      - name: Check FastAPI health
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p 6970 \
            ubuntu@192.168.17.55 \
            '
              sleep 5

              curl --fail \
                http://127.0.0.1:8001/health
            '
