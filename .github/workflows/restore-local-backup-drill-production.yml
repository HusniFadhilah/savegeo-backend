name: SAVEGEO production local backup restore drill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: savegeo-production-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout restore drill script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install SSH and VPN tools
        run: sudo apt-get update && sudo apt-get install -y openvpn openssh-client netcat-openbsd

      - name: Connect production VPN
        env:
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPN_CONFIG_B64" && test -n "$VPN_AUTH_B64"
          printf '%s' "$VPN_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/savegeo-vpn.ovpn"
          printf '%s' "$VPN_AUTH_B64" | base64 --decode > "$RUNNER_TEMP/savegeo-vpn-auth.txt"
          chmod 600 "$RUNNER_TEMP/savegeo-vpn.ovpn" "$RUNNER_TEMP/savegeo-vpn-auth.txt"
          sudo openvpn --config "$RUNNER_TEMP/savegeo-vpn.ovpn" --auth-user-pass "$RUNNER_TEMP/savegeo-vpn-auth.txt" --daemon --log "$RUNNER_TEMP/openvpn.log"
          for attempt in $(seq 1 30); do
            nc -z -w 3 "$DEPLOY_HOST" "$DEPLOY_SSH_PORT" && exit 0
            sleep 3
          done
          sudo cat "$RUNNER_TEMP/openvpn.log" || true
          exit 1

      - name: Configure pinned SSH host and key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS" && test -n "$DEPLOY_SSH_PRIVATE_KEY"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/savegeo-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/savegeo-deploy-key"
          chmod 600 "$RUNNER_TEMP/savegeo-known-hosts" "$RUNNER_TEMP/savegeo-deploy-key"

      - name: Restore latest verified pre-deploy backup in an isolated disposable database
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_SSH_PORT" && test -n "$DEPLOY_USER" && test -n "$BACKEND_REMOTE_DIR"
          remote_script="$BACKEND_REMOTE_DIR/var/restore-local-backup-drill-$GITHUB_RUN_ID.sh"
          remote_selector="$BACKEND_REMOTE_DIR/var/select-verified-backup-$GITHUB_RUN_ID.py"
          scp -i "$RUNNER_TEMP/savegeo-deploy-key" -P "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/savegeo-known-hosts" \
            scripts/restore_local_backup_drill.sh "$DEPLOY_USER@$DEPLOY_HOST:$remote_script"
          scp -i "$RUNNER_TEMP/savegeo-deploy-key" -P "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/savegeo-known-hosts" \
            scripts/select_verified_backup.py "$DEPLOY_USER@$DEPLOY_HOST:$remote_selector"
          ssh -i "$RUNNER_TEMP/savegeo-deploy-key" -p "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/savegeo-known-hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; chmod 700 '$remote_script' '$remote_selector'; trap 'rm -f -- \"$remote_script\" \"$remote_selector\"' EXIT; SAVEGEO_LOCAL_BACKUP_DIR='$BACKEND_REMOTE_DIR/../private-backups' SAVEGEO_BACKUP_SELECTOR='$remote_selector' bash '$remote_script'"
