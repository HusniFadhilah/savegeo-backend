name: Validate SAVEGEO backend

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: savegeo_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savegeo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savegeo_ci -d savegeo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install, lint, typecheck, security audit, and test
        env:
          DEBUG: "false"
          SAVEGEO_DEPLOYMENT_ENVIRONMENT: ci
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://savegeo_ci:postgres@127.0.0.1:5432/savegeo_ci
          WORKSPACE_TEST_DATABASE_URL: postgresql+psycopg://savegeo_ci:postgres@127.0.0.1:5432/savegeo_ci
          DMRV_TEST_DATABASE_URL: postgresql+psycopg://savegeo_ci:postgres@127.0.0.1:5432/savegeo_ci
        run: |
          python scripts/write_build_metadata.py --output build-metadata.json
          python scripts/validate_build_metadata.py build-metadata.json --expected-environment ci
          python scripts/validate_release_manifest.py "release/v$(python -c 'from scripts.write_build_metadata import project_version; print(project_version())').json" --require-current
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.lock
          pip install --no-deps --no-build-isolation -e .
          ruff check . --ignore E501 --ignore B904 --ignore B905
          bash -n scripts/load_backup_environment.sh scripts/backup_offsite.sh scripts/restore_drill.sh scripts/restore_local_backup_drill.sh scripts/install_backup_host_dependencies.sh scripts/setup_local_s3_backup_storage.sh
          python scripts/audit_standards.py --check > standards-audit.json
          mypy app
          mypy --config-file .github/mypy-surface.ini app/api/routes app/providers app/registries
          bandit -r app -lll
          for attempt in 1 2 3; do
            if pip-audit -r requirements-api.lock --no-deps --disable-pip; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pip-audit failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::pip-audit could not reach its advisory service; retrying in 10 seconds (attempt $attempt/3)"
            sleep 10
          done
          for attempt in 1 2 3; do
            if pip-audit -r requirements-optional.lock --no-deps --disable-pip; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pip-audit failed for optional model runtime dependencies after $attempt attempts"
              exit 1
            fi
            echo "::warning::pip-audit could not complete the optional runtime audit; retrying in 10 seconds (attempt $attempt/3)"
            sleep 10
          done
          alembic upgrade head
          pytest

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull "$GITLEAKS_IMAGE"; then
              pulled=true
              break
            fi
            echo "Gitleaks image pull failed (attempt $attempt/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          if [ "$pulled" != true ]; then
            echo "Unable to pull $GITLEAKS_IMAGE after 5 attempts." >&2
            exit 1
          fi
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "$GITLEAKS_IMAGE" detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1
          status=$?
          if [ -s gitleaks-report.json ]; then
            jq '[.[] | {RuleID, File, StartLine, Description}]' gitleaks-report.json
          fi
          exit "$status"

  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare runner disk for inference image scan
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import shutil
          # These SDKs are preinstalled on the disposable runner and are unused here.
          for name in ("/usr/local/lib/android", "/usr/share/dotnet", "/usr/share/swift"):
              target = Path(name)
              if target.exists():
                  if target.resolve() != target:
                      raise SystemExit("Unexpected SDK path")
                  shutil.rmtree(target)
          PY
          df -h /

      - name: Build backend image
        run: |
          docker build -t savegeo-backend:ci .
          # Retain the tagged runtime image; remove intermediate builder cache.
          docker builder prune --all --force
          df -h /

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: savegeo-backend:ci
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 15m
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Report Trivy findings
        if: failure()
        run: |
          test -s trivy-results.json || { echo "::error::Trivy failed before producing a vulnerability report"; exit 1; }
          jq '[.Results[]? as $result | (($result.Vulnerabilities // [])[]? | {type: "vulnerability", target: $result.Target, id: .VulnerabilityID, package: .PkgName, severity: .Severity, fixed_version: .FixedVersion}), (($result.Secrets // [])[]? | {type: "secret", target: $result.Target, rule_id: .RuleID, category: .Category, severity: .Severity, title: .Title, start_line: .StartLine})] | {count: length, findings: .}' trivy-results.json
