name: Validate SAVEGEO backend

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install, lint, typecheck, security audit, and test
        env:
          DEBUG: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check . --ignore E501 --ignore B904 --ignore B905
          mypy app
          bandit -r app -lll
          # scikit-learn is pinned for existing pickle model compatibility; remove this ignore after retraining.
          pip-audit . --ignore-vuln PYSEC-2024-110
          pytest

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for secrets
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --no-git \
            --redact \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1
          status=$?
          if [ -s gitleaks-report.json ]; then
            jq '[.[] | {RuleID, File, StartLine, Description}]' gitleaks-report.json
          fi
          exit "$status"

  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t savegeo-backend:ci .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: savegeo-backend:ci
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Report Trivy findings
        if: failure()
        run: |
          jq '[.Results[]? | {Target, Vulnerabilities: [.Vulnerabilities[]? | {VulnerabilityID, PkgName, InstalledVersion, FixedVersion, Severity}] } | select(.Vulnerabilities | length > 0)]' trivy-results.json
