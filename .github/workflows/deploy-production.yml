name: Test and deploy SAVEGEO backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: savegeo-backend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      metadata_artifact_outcome: ${{ steps.metadata_artifact.outcome }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install, lint, typecheck, security audit, and test
        env:
          DEBUG: "false"
          SAVEGEO_DEPLOYMENT_ENVIRONMENT: production
        run: |
          python scripts/write_build_metadata.py --output build-metadata.json
          python scripts/validate_build_metadata.py build-metadata.json --expected-environment production --require-workflow
          python -m pip install --upgrade pip
          pip install -e ".[dev,cams]"
          ruff check . --ignore E501 --ignore B904 --ignore B905
          mypy app
          bandit -r app -lll
          # scikit-learn is pinned for existing pickle model compatibility; remove this ignore after retraining.
          for attempt in 1 2 3; do
            if pip-audit . --ignore-vuln PYSEC-2024-110; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pip-audit failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::pip-audit could not reach its advisory service; retrying in 10 seconds (attempt $attempt/3)"
            sleep 10
          done
          pytest
      - name: Preserve validated build metadata in job summary
        run: |
          {
            printf '### Validated backend build metadata\n\n```json\n'
            cat build-metadata.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production build metadata
        id: metadata_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: savegeo-backend-production-build-metadata
          path: build-metadata.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [validate, gitleaks, trivy]
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
      BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
      SAVEGEO_BUILD_NUMBER: ${{ github.run_number }}
      SAVEGEO_RUN_ATTEMPT: ${{ github.run_attempt }}
      SAVEGEO_COMMIT_SHA: ${{ github.sha }}
      SAVEGEO_REF: ${{ github.ref }}
      SAVEGEO_WORKFLOW_NAME: ${{ github.workflow }}
      SAVEGEO_WORKFLOW_RUN_ID: ${{ github.run_id }}
      SAVEGEO_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SAVEGEO_DEPLOYMENT_ENVIRONMENT: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and validate build metadata
        if: needs.validate.outputs.metadata_artifact_outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: savegeo-backend-production-build-metadata
          path: build-metadata-artifact

      - name: Recreate metadata from validated source when artifact storage is unavailable
        if: needs.validate.outputs.metadata_artifact_outcome == 'failure'
        run: |
          echo '::warning::Metadata artifact upload failed; recreating provenance from this validated commit and workflow context.'
          python3 scripts/write_build_metadata.py --output build-metadata-artifact/build-metadata.json

      - name: Load product version and build time from metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path("build-metadata-artifact/build-metadata.json").read_text())
          print(f"SAVEGEO_PRODUCT_VERSION={data['product_version']}")
          print(f"SAVEGEO_BUILD_TIME_UTC={data['build_time_utc']}")
          PY

      - name: Validate deployment metadata matches this commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/validate_build_metadata.py build-metadata-artifact/build-metadata.json --expected-sha "$GITHUB_SHA" --expected-environment production --require-workflow

      - name: Validate production deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            DEPLOY_HOST DEPLOY_SSH_PORT DEPLOY_USER BACKEND_REMOTE_DIR \
            BACKEND_HEALTH_URL VPN_CONFIG_B64 VPN_AUTH_B64 SSH_KNOWN_HOSTS SSH_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production GitHub Secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if ! [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]] || (( DEPLOY_SSH_PORT < 1 || DEPLOY_SSH_PORT > 65535 )); then
            echo 'DEPLOY_SSH_PORT must be a valid TCP port.' >&2
            exit 1
          fi

          printf '%s' "$VPN_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/vpn-config-check.ovpn"
          printf '%s' "$VPN_AUTH_B64" | base64 --decode > "$RUNNER_TEMP/vpn-auth-check.txt"
          test -s "$RUNNER_TEMP/vpn-config-check.ovpn"
          test -s "$RUNNER_TEMP/vpn-auth-check.txt"
          rm -f "$RUNNER_TEMP/vpn-config-check.ovpn" "$RUNNER_TEMP/vpn-auth-check.txt"

      - name: Install VPN and deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn sshpass rsync netcat-openbsd

      - name: Connect VPN
        env:
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$VPN_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/client.ovpn"
          printf '%s' "$VPN_AUTH_B64" | base64 --decode > "$RUNNER_TEMP/vpn-auth.txt"
          chmod 600 "$RUNNER_TEMP/client.ovpn" "$RUNNER_TEMP/vpn-auth.txt"
          sudo openvpn --config "$RUNNER_TEMP/client.ovpn" \
            --auth-user-pass "$RUNNER_TEMP/vpn-auth.txt" \
            --daemon --log "$RUNNER_TEMP/openvpn.log"
          for i in $(seq 1 30); do
            nc -z -w 3 "$DEPLOY_HOST" "$DEPLOY_SSH_PORT" && exit 0
            sleep 3
          done
          sudo cat "$RUNNER_TEMP/openvpn.log" || true
          exit 1

      - name: Configure SSH host verification
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronize backend source
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$BACKEND_REMOTE_DIR'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'var/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'build-metadata-artifact/' \
            -e "sshpass -e ssh -p $DEPLOY_SSH_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_REMOTE_DIR/"

      - name: Deploy containers
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/deploy-backend.sh" <<'REMOTE_DEPLOY'
            set -euo pipefail
            cd "$BACKEND_REMOTE_DIR"
            test -s .env
            mkdir -p var/exports var/uploads var/saved_models var/disaster_rasters var/samgeo var/gee-credentials
            test -e var/deployment-metadata.json || printf '{}\n' > var/deployment-metadata.json
            if docker compose -f docker-compose.prod.yml ps --status running db | grep -q db; then
              docker compose -f docker-compose.prod.yml exec -T db \
                pg_dump -U savegeo -Fc savegeo \
                > "var/exports/predeploy_$(date +%Y%m%d_%H%M%S).dump"
            fi
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              --volume "$BACKEND_REMOTE_DIR/../frontend/dist:/frontend-assets:ro" \
              api python -m scripts.check_auth_secret --frontend-dist /frontend-assets
            docker compose -f docker-compose.prod.yml up -d --no-build
            healthy=0
            for i in $(seq 1 30); do
              if curl --fail --silent "$BACKEND_HEALTH_URL" >/dev/null; then
                healthy=1
                break
              fi
              sleep 3
            done
            if [ "$healthy" -ne 1 ]; then
              docker compose -f docker-compose.prod.yml logs --tail=150 api
              exit 1
            fi
            # Check Ollama from inside the same API container that serves the
            # chatbot. The script is a no-op when another AI provider is set.
            docker compose -f docker-compose.prod.yml exec -T api \
              env OLLAMA_PREFLIGHT_INFERENCE=true OLLAMA_PREFLIGHT_TIMEOUT_SECONDS=120 \
              python -m scripts.check_ollama
            # Runtime model files are deliberately excluded from rsync. Refresh
            # the database registry from their sidecar metadata after every
            # deploy so GEDI L4A/L4D and ESA CCI model choices match the files
            # actually mounted on this server.
            docker compose -f docker-compose.prod.yml exec -T api \
              python -m scripts.import_legacy_models /app/var/saved_models
            curl --fail --silent "$BACKEND_HEALTH_URL" >/dev/null
            deployment_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # Preserve the validated CI build provenance. The SSH host does
            # not have the runner's GITHUB_* environment.
            python3 scripts/validate_build_metadata.py var/build-metadata.json --expected-sha "$SAVEGEO_COMMIT_SHA" --expected-environment production --require-workflow
            python3 -c 'import json, sys; from pathlib import Path; data = json.loads(Path("var/build-metadata.json").read_text()); data["deployed_at_utc"] = sys.argv[1]; target = Path("var/deployment-metadata.json"); temporary = target.with_suffix(".json.tmp"); temporary.write_text(json.dumps(data, indent=2) + "\n"); temporary.replace(target)' "$deployment_time"
            # Verify the actual container, independent of external proxy routing.
            docker compose -f docker-compose.prod.yml exec -T api \
              python -c 'import os; from app.core.version import get_public_version_metadata; actual = get_public_version_metadata()["commit_sha"]; expected = os.environ["SAVEGEO_COMMIT_SHA"]; assert actual == expected, f"Container revision mismatch: {actual} != {expected}"'
            curl --fail --silent "${BACKEND_HEALTH_URL%/health}/version" > var/deployed-version.json
            python3 scripts/validate_build_metadata.py var/deployed-version.json --expected-sha "$SAVEGEO_COMMIT_SHA" --expected-environment production --require-workflow
            echo "Container deployment verified"
          REMOTE_DEPLOY
          # Transfer a file and execute it explicitly. This avoids relying on
          # stdin surviving the SSH authentication and connection setup.
          sshpass -e scp -P "$DEPLOY_SSH_PORT" "$RUNNER_TEMP/deploy-backend.sh" \
            "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_REMOTE_DIR/var/deploy-backend.sh"
          sshpass -e scp -P "$DEPLOY_SSH_PORT" build-metadata-artifact/build-metadata.json \
            "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_REMOTE_DIR/var/build-metadata.json"
          sshpass -e ssh -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "BACKEND_REMOTE_DIR='$BACKEND_REMOTE_DIR' BACKEND_HEALTH_URL='$BACKEND_HEALTH_URL' SAVEGEO_PRODUCT_VERSION='$SAVEGEO_PRODUCT_VERSION' SAVEGEO_BUILD_NUMBER='$SAVEGEO_BUILD_NUMBER' SAVEGEO_RUN_ATTEMPT='$SAVEGEO_RUN_ATTEMPT' SAVEGEO_COMMIT_SHA='$SAVEGEO_COMMIT_SHA' SAVEGEO_REF='$SAVEGEO_REF' SAVEGEO_BUILD_TIME_UTC='$SAVEGEO_BUILD_TIME_UTC' SAVEGEO_WORKFLOW_NAME='$SAVEGEO_WORKFLOW_NAME' SAVEGEO_WORKFLOW_RUN_ID='$SAVEGEO_WORKFLOW_RUN_ID' SAVEGEO_WORKFLOW_RUN_URL='$SAVEGEO_WORKFLOW_RUN_URL' SAVEGEO_DEPLOYMENT_ENVIRONMENT='$SAVEGEO_DEPLOYMENT_ENVIRONMENT' bash '$BACKEND_REMOTE_DIR/var/deploy-backend.sh'"

      - name: Record production deployment
        run: |
          python3 scripts/write_deployment_record.py --metadata build-metadata-artifact/build-metadata.json --output backend-production-deployment-record.json --environment production
          {
            printf '### Verified backend production deployment\n\n```json\n'
            cat backend-production-deployment-record.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production deployment record
        id: deployment_record_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: savegeo-backend-production-deployment-record
          path: backend-production-deployment-record.json
          if-no-files-found: error
          retention-days: 7

      - name: Report optional deployment artifact upload failure
        if: steps.deployment_record_artifact.outcome == 'failure'
        run: echo '::warning::Deployment and health checks passed. Artifact upload failed; the verified deployment record remains available in this job summary and on the server.'

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        run: |
          set -euo pipefail
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull "$GITLEAKS_IMAGE"; then
              pulled=true
              break
            fi
            echo "Gitleaks image pull failed (attempt $attempt/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          if [ "$pulled" != true ]; then
            echo "Unable to pull $GITLEAKS_IMAGE after 5 attempts." >&2
            exit 1
          fi
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "$GITLEAKS_IMAGE" detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --no-git \
            --redact \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1
          status=$?
          if [ -s gitleaks-report.json ]; then
            jq '[.[] | {RuleID, File, StartLine, Description}]' gitleaks-report.json
          fi
          exit "$status"

  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner disk for inference image scan
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import shutil
          # These SDKs are preinstalled on the disposable runner and are unused here.
          for name in ("/usr/local/lib/android", "/usr/share/dotnet", "/usr/share/swift"):
              target = Path(name)
              if target.exists():
                  if target.resolve() != target:
                      raise SystemExit("Unexpected SDK path")
                  shutil.rmtree(target)
          PY
          df -h /

      - name: Build backend image
        run: |
          docker build -t savegeo-backend:ci .
          # Retain the tagged runtime image; remove intermediate builder cache.
          docker builder prune --all --force
          df -h /

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: savegeo-backend:ci
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Report Trivy findings
        if: failure()
        run: |
          test -s trivy-results.json || { echo "::error::Trivy failed before producing a vulnerability report"; exit 1; }
          jq '[.Results[]? as $result | (($result.Vulnerabilities // [])[]? | {type: "vulnerability", target: $result.Target, id: .VulnerabilityID, package: .PkgName, severity: .Severity, fixed_version: .FixedVersion}), (($result.Secrets // [])[]? | {type: "secret", target: $result.Target, rule_id: .RuleID, category: .Category, severity: .Severity, title: .Title, start_line: .StartLine})] | {count: length, findings: .}' trivy-results.json
