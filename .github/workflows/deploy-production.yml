name: Test and deploy SAVEGEO backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: savegeo_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savegeo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savegeo_ci -d savegeo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      metadata_artifact_outcome: ${{ steps.metadata_artifact.outcome }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install, lint, typecheck, security audit, and test
        env:
          DEBUG: "false"
          SAVEGEO_DEPLOYMENT_ENVIRONMENT: production
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://savegeo_ci:postgres@127.0.0.1:5432/savegeo_ci
          WORKSPACE_TEST_DATABASE_URL: postgresql+psycopg://savegeo_ci:postgres@127.0.0.1:5432/savegeo_ci
          DMRV_TEST_DATABASE_URL: postgresql+psycopg://savegeo_ci:postgres@127.0.0.1:5432/savegeo_ci
        run: |
          python scripts/write_build_metadata.py --output build-metadata.json
          python scripts/validate_build_metadata.py build-metadata.json --expected-environment production --require-workflow
          python scripts/validate_release_manifest.py "release/v$(python -c 'from scripts.write_build_metadata import project_version; print(project_version())').json" --require-current
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.lock
          pip install --no-deps --no-build-isolation -e .
          ruff check . --ignore E501 --ignore B904 --ignore B905
          mypy app
          mypy --config-file .github/mypy-surface.ini app/api/routes app/providers app/registries
          bash -n scripts/load_backup_environment.sh scripts/backup_offsite.sh scripts/restore_drill.sh scripts/restore_local_backup_drill.sh
          bandit -r app -lll
          for attempt in 1 2 3; do
            if pip-audit -r requirements-api.lock --no-deps --disable-pip; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pip-audit failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::pip-audit could not reach its advisory service; retrying in 10 seconds (attempt $attempt/3)"
            sleep 10
          done
          for attempt in 1 2 3; do
            if pip-audit -r requirements-optional.lock --no-deps --disable-pip; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pip-audit failed for optional model runtime dependencies after $attempt attempts"
              exit 1
            fi
            echo "::warning::pip-audit could not complete the optional runtime audit; retrying in 10 seconds (attempt $attempt/3)"
            sleep 10
          done
          alembic upgrade head
          pytest
      - name: Preserve validated build metadata in job summary
        run: |
          {
            printf '### Validated backend build metadata\n\n```json\n'
            cat build-metadata.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production build metadata
        id: metadata_artifact
        if: vars.SAVEGEO_UPLOAD_ARTIFACTS == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savegeo-backend-production-build-metadata
          path: build-metadata.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [validate, gitleaks, trivy]
    concurrency:
      group: savegeo-backend-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
      BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
      SAVEGEO_BUILD_NUMBER: ${{ github.run_number }}
      SAVEGEO_RUN_ATTEMPT: ${{ github.run_attempt }}
      SAVEGEO_COMMIT_SHA: ${{ github.sha }}
      SAVEGEO_REF: ${{ github.ref }}
      SAVEGEO_WORKFLOW_NAME: ${{ github.workflow }}
      SAVEGEO_WORKFLOW_RUN_ID: ${{ github.run_id }}
      SAVEGEO_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SAVEGEO_DEPLOYMENT_ENVIRONMENT: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download and validate build metadata
        if: needs.validate.outputs.metadata_artifact_outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: savegeo-backend-production-build-metadata
          path: build-metadata-artifact

      - name: Recreate metadata from validated source when no artifact is available
        if: needs.validate.outputs.metadata_artifact_outcome != 'success'
        run: |
          echo 'Creating build metadata from the validated commit and workflow context.'
          python3 scripts/write_build_metadata.py --output build-metadata-artifact/build-metadata.json

      - name: Load product version and build time from metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path("build-metadata-artifact/build-metadata.json").read_text())
          print(f"SAVEGEO_PRODUCT_VERSION={data['product_version']}")
          print(f"SAVEGEO_BUILD_TIME_UTC={data['build_time_utc']}")
          PY

      - name: Validate deployment metadata matches this commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/validate_build_metadata.py build-metadata-artifact/build-metadata.json --expected-sha "$GITHUB_SHA" --expected-environment production --require-workflow

      - name: Validate production deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            DEPLOY_HOST DEPLOY_SSH_PORT DEPLOY_USER BACKEND_REMOTE_DIR \
            BACKEND_HEALTH_URL VPN_CONFIG_B64 VPN_AUTH_B64 SSH_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production GitHub Secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if ! [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]] || (( DEPLOY_SSH_PORT < 1 || DEPLOY_SSH_PORT > 65535 )); then
            echo 'DEPLOY_SSH_PORT must be a valid TCP port.' >&2
            exit 1
          fi

          printf '%s' "$VPN_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/vpn-config-check.ovpn"
          printf '%s' "$VPN_AUTH_B64" | base64 --decode > "$RUNNER_TEMP/vpn-auth-check.txt"
          test -s "$RUNNER_TEMP/vpn-config-check.ovpn"
          test -s "$RUNNER_TEMP/vpn-auth-check.txt"
          rm -f "$RUNNER_TEMP/vpn-config-check.ovpn" "$RUNNER_TEMP/vpn-auth-check.txt"

      - name: Install VPN and deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn rsync netcat-openbsd

      - name: Connect VPN
        env:
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$VPN_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/client.ovpn"
          printf '%s' "$VPN_AUTH_B64" | base64 --decode > "$RUNNER_TEMP/vpn-auth.txt"
          chmod 600 "$RUNNER_TEMP/client.ovpn" "$RUNNER_TEMP/vpn-auth.txt"
          sudo openvpn --config "$RUNNER_TEMP/client.ovpn" \
            --auth-user-pass "$RUNNER_TEMP/vpn-auth.txt" \
            --daemon --log "$RUNNER_TEMP/openvpn.log"
          for i in $(seq 1 30); do
            nc -z -w 3 "$DEPLOY_HOST" "$DEPLOY_SSH_PORT" && exit 0
            sleep 3
          done
          sudo cat "$RUNNER_TEMP/openvpn.log" || true
          exit 1

      - name: Configure SSH host verification
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Synchronize backend source
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$BACKEND_REMOTE_DIR'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.backup' \
            --exclude 'var/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'build-metadata-artifact/' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p $DEPLOY_SSH_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_REMOTE_DIR/"

      - name: Deploy containers
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/deploy-backend.sh" <<'REMOTE_DEPLOY'
            set -euo pipefail
            cd "$BACKEND_REMOTE_DIR"
            test -s .env
            umask 077
            python3 scripts/prepare_runtime_database.py --directory "$BACKEND_REMOTE_DIR"
            mkdir -p var/exports var/uploads var/saved_models var/disaster_rasters var/samgeo var/gee-credentials
            test -e var/deployment-metadata.json || printf '{}\n' > var/deployment-metadata.json
            backup_dir="$BACKEND_REMOTE_DIR/../private-backups"
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            if ! docker compose -f docker-compose.prod.yml ps --status running db | grep -q db; then
              echo "Database container is not running; refusing deployment without a verified pre-deploy backup." >&2
              exit 1
            fi
            backup_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_prefix="$backup_dir/predeploy_$backup_stamp"
            dump_tmp="$backup_prefix.dump.partial"
            docker compose -f docker-compose.prod.yml exec -T db \
              pg_dump -U savegeo -Fc savegeo > "$dump_tmp"
            test -s "$dump_tmp"
            docker compose -f docker-compose.prod.yml exec -T db \
              pg_restore --list < "$dump_tmp" > /dev/null
            mv "$dump_tmp" "$backup_prefix.dump"
            dump_sha256="$(sha256sum "$backup_prefix.dump" | awk '{print $1}')"
            evidence_sha256="absent"
            if [ -d var/dmrv/evidence ]; then
              evidence_tmp="$backup_prefix.dmrv-evidence.tar.gz.partial"
              # Evidence can be owned by the API runtime UID and mode 0600.
              # Read it in a disposable, network-isolated, read-only container
              # with only DAC read/search override; stream the archive back so
              # the host backup remains owned by the deploy user.
              docker run --rm --network none --read-only --user 0:0 \
                --cap-drop ALL --cap-add DAC_READ_SEARCH \
                --volume "$BACKEND_REMOTE_DIR/var/dmrv:/source/dmrv:ro" \
                postgres:16-alpine tar -C /source -czf - dmrv/evidence > "$evidence_tmp"
              test -s "$evidence_tmp"
              tar -tzf "$evidence_tmp" > /dev/null
              mv "$evidence_tmp" "$backup_prefix.dmrv-evidence.tar.gz"
              evidence_sha256="$(sha256sum "$backup_prefix.dmrv-evidence.tar.gz" | awk '{print $1}')"
            fi
            manifest_tmp="$backup_prefix.manifest.partial"
            {
              printf 'created_at_utc=%s\n' "$backup_stamp"
              printf 'application_commit=%s\n' "$SAVEGEO_COMMIT_SHA"
              printf 'database_dump=%s\n' "$(basename "$backup_prefix.dump")"
              printf 'database_sha256=%s\n' "$dump_sha256"
              printf 'dmrv_evidence_archive=%s\n' "$([ "$evidence_sha256" = absent ] && printf absent || basename "$backup_prefix.dmrv-evidence.tar.gz")"
              printf 'dmrv_evidence_sha256=%s\n' "$evidence_sha256"
              printf 'encryption=not-configured-by-this-deployment-step\n'
            } > "$manifest_tmp"
            mv "$manifest_tmp" "$backup_prefix.manifest"
            export DOCKER_BUILDKIT=1
            docker compose -f docker-compose.prod.yml build api dmrv-worker analysis-worker field-prediction-worker green-ranking-worker migrate
            # A checkpointed ranking supervisor runs outside the API container.
            # Pause only its scheduling loop before touching the application;
            # already-running ranking workers remain alive in their own container.
            docker compose -f docker-compose.prod.yml exec -T api \
              python -c 'from pathlib import Path; p=Path("/app/var/uploads/green-rankings"); p.mkdir(parents=True, exist_ok=True); (p/"worker.pause").touch()'
            resume_green_rankings() {
              if docker compose -f docker-compose.prod.yml ps --status running green-ranking-worker | grep -q green-ranking-worker; then
                docker compose -f docker-compose.prod.yml exec -T green-ranking-worker \
                  python -c 'from pathlib import Path; Path("/app/var/uploads/green-rankings/worker.pause").unlink(missing_ok=True)' >/dev/null 2>&1 || true
              elif docker compose -f docker-compose.prod.yml ps --status running api | grep -q api; then
                docker compose -f docker-compose.prod.yml exec -T api \
                  python -c 'from pathlib import Path; Path("/app/var/uploads/green-rankings/worker.pause").unlink(missing_ok=True)' >/dev/null 2>&1 || true
              fi
            }
            trap resume_green_rankings EXIT
            ranking_container="$(docker compose -f docker-compose.prod.yml ps -q green-ranking-worker || true)"
            if [ -n "$ranking_container" ] && [ "$(docker inspect --format '{{.State.Running}}' "$ranking_container")" = true ]; then
              ranking_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$ranking_container")"
              if [ "$ranking_health" != healthy ]; then
                echo "Green-ranking worker exists but is not healthy; refusing to interrupt or replace it." >&2
                exit 1
              fi
              ranking_worker_processes="$(docker top "$ranking_container" -eo args 2>/dev/null || true)"
              if printf '%s\n' "$ranking_worker_processes" | grep -Eq 'current-recovery\.py|history-scheduler\.py|green-ranking-worker\.py|green-ranking-failure-retry\.py'; then
                echo "Keeping the active green-ranking worker container unchanged."
              else
                echo "Refreshing the idle green-ranking supervisor container."
                docker compose -f docker-compose.prod.yml up -d --no-deps green-ranking-worker
              fi
            else
              docker compose -f docker-compose.prod.yml up -d --no-deps green-ranking-worker
            fi
            ranking_container="$(docker compose -f docker-compose.prod.yml ps -q green-ranking-worker)"
            ranking_healthy=0
            for i in $(seq 1 30); do
              ranking_state="$(docker inspect --format '{{.State.Status}}' "$ranking_container")"
              ranking_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$ranking_container")"
              if [ "$ranking_state" = running ] && [ "$ranking_health" = healthy ]; then
                ranking_healthy=1
                break
              fi
              sleep 2
            done
            if [ "$ranking_healthy" -ne 1 ]; then
              docker compose -f docker-compose.prod.yml logs --tail=100 green-ranking-worker
              echo "Checkpointed ranking worker did not become healthy; refusing API deployment." >&2
              exit 1
            fi
            # Do not apply schema changes while any checkpointed ranking worker
            # is active. This release has no pending migration, so the workers
            # can continue while the application image is replaced.
            ranking_processes="$(docker top backend-api-1 -eo args 2>/dev/null || true)"
            if [ -n "$ranking_container" ]; then
              ranking_processes="$ranking_processes $(docker top "$ranking_container" -eo args 2>/dev/null || true)"
            fi
            if printf '%s\n' "$ranking_processes" | grep -Eq 'current-recovery\.py|history-scheduler\.py|green-ranking-worker\.py'; then
              current_revisions="$(docker compose -f docker-compose.prod.yml run --rm --no-deps migrate python -m alembic current 2>/dev/null | awk 'NF {print $1}' | sort -u | tr '\n' ' ')"
              target_revisions="$(docker compose -f docker-compose.prod.yml run --rm --no-deps migrate python -m alembic heads 2>/dev/null | awk 'NF {print $1}' | sort -u | tr '\n' ' ')"
              if [ "$current_revisions" != "$target_revisions" ]; then
                echo "Pending database migrations would run while green-ranking calculations are active; deployment paused safely." >&2
                exit 1
              fi
            fi
            # Keep exact row-count evidence on the production host with mode
            # 0600/0700. Only the pass/fail status and opaque checksum reach
            # the public GitHub Actions log; no production counts are exposed.
            audit_dir="$BACKEND_REMOTE_DIR/var/migration-audit/$SAVEGEO_WORKFLOW_RUN_ID"
            mkdir -p "$audit_dir"
            chmod 700 "$BACKEND_REMOTE_DIR/var/migration-audit" "$audit_dir"
            # Keep the inventory private on the host and run the short-lived
            # migration container as the deploy owner so its atomic 0600 files
            # can be written to this 0700 bind mount without relaxing access.
            audit_uid="$(id -u)"
            audit_gid="$(id -g)"
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              --user "$audit_uid:$audit_gid" \
              --volume "$audit_dir:/app/var/migration-audit" migrate \
              python -m scripts.db_migration_inventory capture \
              --output "/app/var/migration-audit/before.json"
            docker compose -f docker-compose.prod.yml run --rm --no-deps migrate \
              sh -c "python -m alembic upgrade head && python -m scripts.seed_rbac"
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              --user "$audit_uid:$audit_gid" \
              --volume "$audit_dir:/app/var/migration-audit" migrate \
              python -m scripts.db_migration_inventory capture \
              --output "/app/var/migration-audit/after.json" \
              --salt-source "/app/var/migration-audit/before.json"
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              --user "$audit_uid:$audit_gid" \
              --volume "$audit_dir:/app/var/migration-audit" migrate \
              python -m scripts.db_migration_inventory compare \
              --before "/app/var/migration-audit/before.json" \
              --after "/app/var/migration-audit/after.json" \
              --output "/app/var/migration-audit/comparison.json"
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              --volume "$BACKEND_REMOTE_DIR/../frontend/dist:/frontend-assets:ro" \
              api python -m scripts.check_auth_secret --frontend-dist /frontend-assets
            # Leave green-ranking-worker out of this update; it owns the
            # long-running checkpointed calculations and survives API releases.
            docker compose -f docker-compose.prod.yml up -d --no-build api dmrv-worker analysis-worker field-prediction-worker
            healthy=0
            for i in $(seq 1 30); do
              if curl --fail --silent "${BACKEND_HEALTH_URL%/health}/ready" >/dev/null; then
                healthy=1
                break
              fi
              sleep 3
            done
            if [ "$healthy" -ne 1 ]; then
              docker compose -f docker-compose.prod.yml logs --tail=150 api
              exit 1
            fi
            # Enable scheduling only after the new API is ready. The worker
            # resumes each run_id from its persistent checkpoint and clears
            # leases only for those checkpointed runs after a container restart.
            docker compose -f docker-compose.prod.yml exec -T api \
              python -c 'from pathlib import Path; p=Path("/app/var/uploads/green-rankings"); p.mkdir(parents=True, exist_ok=True); (p/"worker.enable").touch(); (p/"worker.pause").unlink(missing_ok=True)'
            trap - EXIT
            # Check Ollama from inside the same API container that serves the
            # chatbot. The script is a no-op when another AI provider is set.
            docker compose -f docker-compose.prod.yml exec -T api \
              env OLLAMA_PREFLIGHT_INFERENCE=true OLLAMA_PREFLIGHT_TIMEOUT_SECONDS=120 \
              python -m scripts.check_ollama
            # Runtime model files are deliberately excluded from rsync. Refresh
            # the database registry from their sidecar metadata after every
            # deploy so GEDI L4A/L4D and ESA CCI model choices match the files
            # actually mounted on this server.
            docker compose -f docker-compose.prod.yml exec -T api \
              python -m scripts.import_legacy_models /app/var/saved_models
            # Keep the audited, report-based UNDIP demo available to production
            # users. The seed is idempotent and leaves all records as drafts.
            docker compose -f docker-compose.prod.yml exec -T api \
              python -m scripts.seed_undip_dmrv_demo --owner admin --apply
            curl --fail --silent "$BACKEND_HEALTH_URL" >/dev/null
            deployment_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # Preserve the validated CI build provenance. The SSH host does
            # not have the runner's GITHUB_* environment.
            python3 scripts/validate_build_metadata.py var/build-metadata.json --expected-sha "$SAVEGEO_COMMIT_SHA" --expected-environment production --require-workflow
            python3 -c 'import json, sys; from pathlib import Path; data = json.loads(Path("var/build-metadata.json").read_text()); data["deployed_at_utc"] = sys.argv[1]; target = Path("var/deployment-metadata.json"); temporary = target.with_suffix(".json.tmp"); temporary.write_text(json.dumps(data, indent=2) + "\n"); temporary.replace(target)' "$deployment_time"
            # Verify the actual container, independent of external proxy routing.
            docker compose -f docker-compose.prod.yml exec -T api \
              python -c 'import os; from app.core.version import get_public_version_metadata; actual = get_public_version_metadata()["commit_sha"]; expected = os.environ["SAVEGEO_COMMIT_SHA"]; assert actual == expected, f"Container revision mismatch: {actual} != {expected}"'
            curl --fail --silent "${BACKEND_HEALTH_URL%/health}/version" > var/deployed-version.json
            python3 scripts/validate_build_metadata.py var/deployed-version.json --expected-sha "$SAVEGEO_COMMIT_SHA" --expected-environment production --require-workflow
            echo "Container deployment verified"
          REMOTE_DEPLOY
          # Transfer a file and execute it explicitly. This avoids relying on
          # stdin surviving the SSH authentication and connection setup.
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -P "$DEPLOY_SSH_PORT" "$RUNNER_TEMP/deploy-backend.sh" \
            "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_REMOTE_DIR/var/deploy-backend.sh"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -P "$DEPLOY_SSH_PORT" build-metadata-artifact/build-metadata.json \
            "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_REMOTE_DIR/var/build-metadata.json"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "BACKEND_REMOTE_DIR='$BACKEND_REMOTE_DIR' BACKEND_HEALTH_URL='$BACKEND_HEALTH_URL' SAVEGEO_PRODUCT_VERSION='$SAVEGEO_PRODUCT_VERSION' SAVEGEO_BUILD_NUMBER='$SAVEGEO_BUILD_NUMBER' SAVEGEO_RUN_ATTEMPT='$SAVEGEO_RUN_ATTEMPT' SAVEGEO_COMMIT_SHA='$SAVEGEO_COMMIT_SHA' SAVEGEO_REF='$SAVEGEO_REF' SAVEGEO_BUILD_TIME_UTC='$SAVEGEO_BUILD_TIME_UTC' SAVEGEO_WORKFLOW_NAME='$SAVEGEO_WORKFLOW_NAME' SAVEGEO_WORKFLOW_RUN_ID='$SAVEGEO_WORKFLOW_RUN_ID' SAVEGEO_WORKFLOW_RUN_URL='$SAVEGEO_WORKFLOW_RUN_URL' SAVEGEO_DEPLOYMENT_ENVIRONMENT='$SAVEGEO_DEPLOYMENT_ENVIRONMENT' bash '$BACKEND_REMOTE_DIR/var/deploy-backend.sh'"

      - name: Provision encrypted local backup storage
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$BACKEND_REMOTE_DIR' && if ! command -v age >/dev/null || ! command -v aws >/dev/null || ! command -v jq >/dev/null; then bash scripts/install_backup_host_dependencies.sh; fi && bash scripts/setup_local_s3_backup_storage.sh"

      - name: Record production deployment
        run: |
          python3 scripts/write_deployment_record.py --metadata build-metadata-artifact/build-metadata.json --output backend-production-deployment-record.json --environment production
          {
            printf '### Verified backend production deployment\n\n```json\n'
            cat backend-production-deployment-record.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production deployment record
        id: deployment_record_artifact
        if: vars.SAVEGEO_UPLOAD_ARTIFACTS == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savegeo-backend-production-deployment-record
          path: backend-production-deployment-record.json
          if-no-files-found: error
          retention-days: 7

      - name: Report optional deployment artifact upload failure
        if: steps.deployment_record_artifact.outcome == 'failure'
        run: echo '::warning::Deployment and health checks passed. Artifact upload failed; the verified deployment record remains available in this job summary and on the server.'

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull "$GITLEAKS_IMAGE"; then
              pulled=true
              break
            fi
            echo "Gitleaks image pull failed (attempt $attempt/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          if [ "$pulled" != true ]; then
            echo "Unable to pull $GITLEAKS_IMAGE after 5 attempts." >&2
            exit 1
          fi
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "$GITLEAKS_IMAGE" detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1
          status=$?
          if [ -s gitleaks-report.json ]; then
            jq '[.[] | {RuleID, File, StartLine, Description}]' gitleaks-report.json
          fi
          exit "$status"

  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare runner disk for inference image scan
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import shutil
          # These SDKs are preinstalled on the disposable runner and are unused here.
          for name in ("/usr/local/lib/android", "/usr/share/dotnet", "/usr/share/swift"):
              target = Path(name)
              if target.exists():
                  if target.resolve() != target:
                      raise SystemExit("Unexpected SDK path")
                  shutil.rmtree(target)
          PY
          df -h /

      - name: Build backend image
        run: |
          docker build -t savegeo-backend:ci .
          # Retain the tagged runtime image; remove intermediate builder cache.
          docker builder prune --all --force
          df -h /

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: savegeo-backend:ci
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 15m
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Report Trivy findings
        if: failure()
        run: |
          test -s trivy-results.json || { echo "::error::Trivy failed before producing a vulnerability report"; exit 1; }
          jq '[.Results[]? as $result | (($result.Vulnerabilities // [])[]? | {type: "vulnerability", target: $result.Target, id: .VulnerabilityID, package: .PkgName, severity: .Severity, fixed_version: .FixedVersion}), (($result.Secrets // [])[]? | {type: "secret", target: $result.Target, rule_id: .RuleID, category: .Category, severity: .Severity, title: .Title, start_line: .StartLine})] | {count: length, findings: .}' trivy-results.json
