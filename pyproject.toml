[project]
name = "savegeo-backend"
version = "0.1.0"
description = "GEOMOKA/SAVEGEO backend — FastAPI + Supabase Postgres rebuild of the legacy Flask API"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # --- Database ---
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.1",

    # --- Auth ---
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",

    # --- HTTP clients ---
    "httpx>=0.27.0",
    "requests>=2.31.0",

    # --- Supabase Storage (GEE credential files) ---
    "supabase>=2.5.0",

    # --- Google Earth Engine ---
    "earthengine-api==0.1.384",
    "google-auth>=2.25.2",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-storage>=2.14.0",

    # --- ML / model inference ---
    # Saved .pkl models in saved_models/ were trained & pickled with scikit-learn 1.3.2.
    # Newer major/minor versions can fail to unpickle sklearn's Cython loss classes
    # (e.g. __pyx_unpickle_CyHalfSquaredError) — keep pinned until models are retrained.
    "scikit-learn==1.3.2",
    "joblib>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",

    # --- Non-GEE raster / STAC pipeline ---
    "rasterio>=1.3.9",
    "pystac-client>=0.8.3",
    "planetary-computer>=1.0.0",
    # Copernicus Data Space Ecosystem (CDSE) ingestion uses the optional
    # `cdse` extra below. Keep it out of the default install so the production
    # Python 3.11 image/server can deploy the core API without pulling
    # geosave-engine's Python >=3.12 requirement.
    # Self-hosted XYZ tile serving for locally-stored GeoTIFFs (e.g. commercial
    # disaster imagery not in the public GEE catalog, or when GEE asset upload
    # is blocked by a disabled GCP billing account - no Cloud Storage/billing
    # needed, tiles are rendered on-demand straight from disk).
    "rio-tiler>=6.0.0",
    "pyproj>=3.6.0",

    # --- Geo file handling ---
    "pyshp>=2.3.0",

    # --- File / report handling ---
    "Pillow>=10.0.0",
    "python-docx>=1.1.0",
    "pypdf>=3.0.0",

    # --- Agentic AI providers (install whichever you actually use) ---
    "anthropic>=0.30.0",
    "openai>=1.55.3",
    "google-genai>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
cdse = [
    "geosave-engine>=0.1.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7.3",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"app/providers/external_carbon_provider.py" = ["E741"]
"app/providers/local_raster_provider.py" = ["E731"]
"app/registries/map_layer_registry.py" = ["E741"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `def route(db: Session = Depends(get_db))` - the
# call-in-default-argument is the documented, intended usage (FastAPI calls
# it once per request, it's not evaluated once at import time like a normal
# mutable default), not the footgun B008 exists to catch. Ruff's own docs
# name this as the canonical case for extend-immutable-calls.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    # app.core.security.require_permission(code) is a dependency *factory*:
    # called once (inside Depends(...)) to build the actual dependency
    # closure, same shape as Depends itself - not a mutable-default footgun.
    "app.core.security.require_permission",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
follow_imports = "silent"
exclude = [
    "alembic/",
    "scripts/",
    "tests/",
    "app/agentic/",
    "app/api/routes/",
    "app/inference/",
    "app/providers/",
    "app/registries/",
    "app/reporting/",
    "app/services/",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    ".venv-py312-test",
]
