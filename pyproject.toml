[project]
name = "savegeo-backend"
version = "1.0.0"
description = "GEOMOKA/SAVEGEO backend — FastAPI + Supabase Postgres rebuild of the legacy Flask API"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "cryptography==50.0.0",
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # --- Database ---
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.1",

    # --- Auth ---
    "pyjwt>=2.15.0,<3",
    "bcrypt>=4.1.0",

    # --- HTTP clients ---
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "certifi>=2026.10.18",
    "pyasn1>=0.6.5",
    "opentelemetry-api>=1.45.2",
    # Security floors for transitive HTTP/OAuth dependencies (VAPT follow-up).
    "httpx2>=2.12.0,<3",
    "urllib3>=2.8.0,<3",
    "multidict>=6.9.1,<7",
    "oauthlib>=4.0.1,<5",

    # --- Supabase Storage (GEE credential files) ---
    "supabase>=2.5.0",

    # --- Google Earth Engine ---
    "earthengine-api==0.1.384",
    "google-auth>=2.25.2",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-storage>=2.14.0",

    # --- ML / model inference ---
    # Runtime persistence is ONNX + JSON; legacy conversion is offline only.
    "scikit-learn==1.5.2",
    "joblib>=1.0.0",
    "onnx==1.23.2",
    "onnxruntime==1.32.0",
    "skl2onnx==1.20.0",
    "onnxmltools==1.16.0",
    "ml_dtypes==0.5.4",
    "numpy>=1.24.0,<2",
    "pandas>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",

    # --- Non-GEE raster / STAC pipeline ---
    "rasterio>=1.3.9",
    "pystac-client>=0.8.3",
    "planetary-computer>=1.0.0",
    # Copernicus Data Space Ecosystem (CDSE) ingestion uses the optional
    # `cdse` extra below. Keep it out of the default install so the production
    # Python 3.11 image/server can deploy the core API without pulling
    # geosave-engine's Python >=3.12 requirement.
    # Self-hosted XYZ tile serving for locally-stored GeoTIFFs (e.g. commercial
    # disaster imagery not in the public GEE catalog, or when GEE asset upload
    # is blocked by a disabled GCP billing account - no Cloud Storage/billing
    # needed, tiles are rendered on-demand straight from disk).
    "rio-tiler>=6.0.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",

    # --- Geo file handling ---
    "pyshp>=2.3.0",

    # --- File / report handling ---
    "Pillow>=13.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.4,<7",
    "defusedxml==0.7.1",

    # --- Agentic AI providers (install whichever you actually use) ---
    "anthropic>=0.30.0",
    "openai>=1.55.3",
    "google-genai>=1.0.0",
    "tenacity>=8.2.0",
    "msgpack>=1.2.1",
]

[project.optional-dependencies]
samgeo = [
    "segment-geospatial>=1.4.2,<2",
    "transformers>=4.51,<6",
]
cdse = [
    "geosave-engine>=0.1.1",
]
cams = [
    "cdsapi>=0.7.7",
    "xarray>=2024.1,<2027",
    "netCDF4>=1.6.5",
]
granite-biomass = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "terratorch==1.2.13",
    "lightning>=2.6.6",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "geopandas>=1.1.2",
]
mlops = [
    "dvc>=3.0,<4",
    "mlflow>=3.0,<4",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7.3",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"app/providers/external_carbon_provider.py" = ["E741"]
"app/providers/local_raster_provider.py" = ["E731"]
"app/registries/map_layer_registry.py" = ["E741"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `def route(db: Session = Depends(get_db))` - the
# call-in-default-argument is the documented, intended usage (FastAPI calls
# it once per request, it's not evaluated once at import time like a normal
# mutable default), not the footgun B008 exists to catch. Ruff's own docs
# name this as the canonical case for extend-immutable-calls.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    # app.core.security.require_permission(code) is a dependency *factory*:
    # called once (inside Depends(...)) to build the actual dependency
    # closure, same shape as Depends itself - not a mutable-default footgun.
    "app.core.security.require_permission",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
follow_imports = "silent"
exclude = [
    "alembic/",
    "scripts/",
    "tests/",
    "app/agentic/",
    "app/api/routes/",
    "app/inference/",
    "app/providers/",
    "app/registries/",
    "app/reporting/",
    "app/services/",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    ".venv-py312-test",
]
